name: milypico_pos
description: "Offline-First Punto de Venta (POS) con carritos multi-cliente, multi-divisa y respaldo en Google Drive."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
